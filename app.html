<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILLALOBOS — Punto de Venta</title>
<link rel="manifest" href="./manifest.json" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg-main:#08090a;--bg-card:#111316;--bg-card2:#16191e;--border:#242830;--text:#f0f4f8;--muted:#8b95a3;--accent:#b8c0cc;--green:#3ecf8e;--red:#ff6b6b;--yellow:#ffd166}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg-main);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .topbar{height:56px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:100;flex-shrink:0}
  .topbar-brand{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text)}
  .topbar-actions{display:flex;align-items:center;gap:.75rem}
  .btn-icon{background:var(--bg-card2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:1rem;text-decoration:none;font-family:'Inter',sans-serif}
  .btn-icon:hover{color:var(--text);border-color:var(--accent)}
  .pos-layout{display:flex;flex:1;height:calc(100vh - 56px);overflow:hidden}
  .products-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
  .panel-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;flex-shrink:0}
  .search-box{flex:1;background:var(--bg-card2);border:1px solid var(--border);color:var(--text);padding:.55rem 1rem;border-radius:8px;font-size:.875rem;outline:none;transition:.2s;font-family:'Inter',sans-serif}
  .search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,192,204,.08)}
  .btn-sm{background:var(--text);color:var(--bg-main);border:none;padding:.55rem 1rem;border-radius:8px;font-weight:600;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:.35rem;transition:.2s;font-family:'Inter',sans-serif;white-space:nowrap}
  .btn-sm:hover{background:var(--accent)}
  .btn-sm.secondary{background:var(--bg-card2);color:var(--text);border:1px solid var(--border)}
  .btn-sm.secondary:hover{border-color:var(--accent)}
  .btn-sm.danger{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.2)}
  .btn-sm.danger:hover{background:rgba(255,107,107,.2)}
  .products-grid{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.75rem;align-content:start}
  .products-grid::-webkit-scrollbar{width:4px}
  .products-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .product-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1rem;cursor:pointer;transition:.2s;position:relative}
  .product-card:hover{border-color:var(--accent);background:var(--bg-card2);transform:translateY(-1px)}
  .product-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.4rem}
  .product-name{font-size:.875rem;font-weight:600;margin-bottom:.3rem;line-height:1.3}
  .product-price{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700}
  .product-price-unit{font-size:.65rem;color:var(--muted)}
  .stock-badge{position:absolute;top:.6rem;right:.6rem;font-size:.62rem;padding:.15rem .45rem;border-radius:20px;background:rgba(62,207,142,.1);color:var(--green)}
  .stock-badge.low{background:rgba(255,209,102,.1);color:var(--yellow)}
  .stock-badge.out{background:rgba(255,107,107,.1);color:var(--red)}
  .empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;color:var(--muted);text-align:center;gap:1rem}
  .empty-state i{font-size:3rem;opacity:.3}
  .empty-state p{font-size:.875rem}
  .invoice-panel{width:380px;min-width:340px;display:flex;flex-direction:column;background:var(--bg-card);overflow:hidden;flex-shrink:0}
  .invoice-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0}
  .invoice-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.1rem}
  .invoice-num{font-size:.72rem;color:var(--muted)}
  .client-section{padding:.75rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
  .field-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
  .field-input{width:100%;background:var(--bg-main);border:1px solid var(--border);color:var(--text);padding:.5rem .65rem;border-radius:6px;font-size:.8rem;outline:none;transition:.2s;font-family:'Inter',sans-serif}
  .field-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(184,192,204,.08)}
  .cart-items{flex:1;overflow-y:auto;padding:.5rem 0}
  .cart-items::-webkit-scrollbar{width:3px}
  .cart-items::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:.75rem;padding:2rem;text-align:center}
  .cart-empty i{font-size:2.5rem;opacity:.25}
  .cart-empty p{font-size:.8rem}
  .cart-item{display:flex;align-items:flex-start;gap:.5rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--border);transition:.15s}
  .cart-item:hover{background:rgba(255,255,255,.02)}
  .cart-item-info{flex:1;min-width:0}
  .cart-item-name{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cart-item-price{font-size:.72rem;color:var(--muted)}
  .cart-item-controls{display:flex;align-items:center;gap:.3rem;flex-shrink:0;margin-top:.15rem}
  .qty-btn{width:22px;height:22px;border-radius:5px;background:var(--bg-card2);border:1px solid var(--border);color:var(--text);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .qty-btn:hover{background:var(--border)}
  .qty-val{font-size:.8rem;font-weight:600;min-width:20px;text-align:center}
  .cart-item-total{font-size:.8rem;font-weight:600;min-width:64px;text-align:right;flex-shrink:0;padding-top:.15rem}
  .remove-btn{color:var(--red);opacity:.5;cursor:pointer;font-size:.9rem;padding:.15rem;transition:.15s;background:none;border:none;margin-top:.1rem}
  .remove-btn:hover{opacity:1}
  .invoice-totals{padding:.75rem 1.25rem;border-top:1px solid var(--border);background:var(--bg-card2);flex-shrink:0}
  .total-row{display:flex;justify-content:space-between;font-size:.8rem;padding:.2rem 0}
  .total-row.bold{font-weight:700;font-size:1rem;padding-top:.5rem;margin-top:.4rem}
  .payment-section{padding:.75rem 1.25rem;border-top:1px solid var(--border);flex-shrink:0}
  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .btn-generate{background:var(--text);color:var(--bg-main);border:none;padding:.7rem;border-radius:8px;font-weight:700;font-size:.875rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:.2s;font-family:'Inter',sans-serif}
  .btn-generate:hover{background:var(--accent);transform:translateY(-1px)}
  .btn-generate:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-clear{background:rgba(255,107,107,.08);color:var(--red);border:1px solid rgba(255,107,107,.2);padding:.7rem;border-radius:8px;font-weight:600;font-size:.875rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:.2s;font-family:'Inter',sans-serif}
  .btn-clear:hover{background:rgba(255,107,107,.15)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(4px)}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:.2s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:1.5rem;display:flex;align-items:center;gap:.5rem}
  .form-group{margin-bottom:1rem}
  .form-label{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
  .form-input{width:100%;background:var(--bg-main);border:1px solid var(--border);color:var(--text);padding:.65rem .85rem;border-radius:8px;font-size:.875rem;outline:none;transition:.2s;font-family:'Inter',sans-serif}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,192,204,.08)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .modal-actions{display:flex;gap:.75rem;margin-top:1.5rem}
  .btn-modal-save{flex:1;background:var(--text);color:var(--bg-main);border:none;padding:.7rem;border-radius:8px;font-weight:700;font-size:.875rem;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif}
  .btn-modal-save:hover{background:var(--accent)}
  .btn-modal-cancel{flex:1;background:var(--bg-card2);color:var(--muted);border:1px solid var(--border);padding:.7rem;border-radius:8px;font-weight:600;font-size:.875rem;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif}
  .btn-modal-cancel:hover{color:var(--text)}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.1rem;font-size:.8rem;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(20px);opacity:0;transition:.3s;display:flex;align-items:center;gap:.5rem;max-width:300px}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.success{border-color:rgba(62,207,142,.3);color:var(--green)}
  .toast.error{border-color:rgba(255,107,107,.3);color:var(--red)}
  @media(max-width:900px){.pos-layout{flex-direction:column}.invoice-panel{width:100%;min-width:unset;max-height:55vh}.products-panel{height:45vh}}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="topbar-brand"><i class="ti ti-shield-lock"></i> VILLALOBOS</a>
  <div class="topbar-actions">
    <span style="font-size:.75rem;color:var(--muted)" id="clock"></span>
    <a href="index.html" class="btn-icon" title="Dashboard"><i class="ti ti-layout-dashboard"></i></a>
    <button class="btn-icon" onclick="doLogout()" title="Cerrar Sesión"><i class="ti ti-logout"></i></button>
  </div>
</header>

<div class="pos-layout">
  <section class="products-panel">
    <div class="panel-header">
      <input type="text" class="search-box" id="search-input" placeholder="Buscar producto..." oninput="filterProducts()">
      <button class="btn-sm" onclick="openModal()"><i class="ti ti-plus"></i> Producto</button>
    </div>
    <div class="products-grid" id="products-grid">
      <div class="empty-state"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i><p>Cargando productos...</p></div>
    </div>
  </section>

  <aside class="invoice-panel">
    <div class="invoice-header">
      <div class="invoice-title">Registro <span id="inv-type-label">Nota de Entrega</span></div>
      <div class="invoice-num" id="inv-num-label">Nro. 00000001 · <span id="inv-date"></span></div>
    </div>
    <div class="client-section">
      <div class="field-row">
        <div>
          <div class="field-label">Tipo ID</div>
          <select class="field-input" id="client-type">
            <option value="V">V – Natural</option>
            <option value="J">J – Jurídico</option>
            <option value="E">E – Extranjero</option>
            <option value="P">P – Pasaporte</option>
          </select>
        </div>
        <div>
          <div class="field-label">Cédula / RIF</div>
          <input type="text" class="field-input" id="client-rif" placeholder="12345678">
        </div>
      </div>
      <div style="margin-bottom:.5rem">
        <div class="field-label">Nombre del Cliente</div>
        <input type="text" class="field-input" id="client-name" placeholder="Cliente de Contado">
      </div>
      <div class="field-row">
        <input type="hidden" id="invoice-type" value="NOTA_ENTREGA">
        <div>
          <div class="field-label">Forma de Pago</div>
          <select class="field-input" id="pay-method">
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="PUNTO">Punto de Venta</option>
            <option value="DIVISAS">Divisas</option>
            <option value="MIXTO">Pago Mixto</option>
          </select>
        </div>
      </div>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty"><i class="ti ti-shopping-cart"></i><p>Selecciona productos del catálogo.</p></div>
    </div>
    <div class="invoice-totals">
      <div class="total-row bold"><span>TOTAL RECIBIDO</span><span id="t-total">Bs. 0,00</span></div>
    </div>
    <div class="payment-section">
      <div class="action-row">
        <button class="btn-generate" id="btn-factura" onclick="registrarPago()">
          <i class="ti ti-check"></i> Registrar Pago
        </button>
        <button class="btn-clear" onclick="clearCart()"><i class="ti ti-trash"></i> Limpiar</button>
      </div>
    </div>
  </aside>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-package"></i> <span id="modal-title-text">Agregar Producto</span></div>
    <div class="form-group">
      <label class="form-label">Nombre del Producto *</label>
      <input type="text" class="form-input" id="p-name" placeholder="Ej: Chaqueta Deportiva">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <input type="text" class="form-input" id="p-cat" placeholder="Ej: Ropa">
      </div>
      <div class="form-group">
        <label class="form-label">Código / Referencia</label>
        <input type="text" class="form-input" id="p-code" placeholder="Ej: CHQ-001">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Precio Neto (Bs.) *</label>
        <input type="number" class="form-input" id="p-price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Stock (Unidades)</label>
        <input type="number" class="form-input" id="p-stock" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-row" style="display: none;">
      <div class="form-group">
        <input type="hidden" id="p-unit" value="UND">
        <input type="hidden" id="p-tax" value="exento">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-save" onclick="saveProduct()">Guardar Producto</button>
      <button class="btn-modal-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = 'https://nmjabbfapjxlejwlkucu.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tamFiYmZhcGp4bGVqd2xrdWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTE4MzYsImV4cCI6MjEwMjM4NzgzNn0.LTIse95x2jiLczlaf77eHN44XnQmAIdm45pR4AwPQr4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const EMPRESA = {
  nombre: 'VILLALOBOS, C.A.',
  direccion: 'Tu Tienda Online - Envíos Nacionales',
  telefono: '+58 414-0000000',
  email: 'ventas@villalobos.com'
};

const IVA = 0.16;
let products = [];
let cart = [];
let invoiceCounter = 1;
let editingId = null;
let currentUserId = null;

const fmtBs = n => 'Bs. ' + parseFloat(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const isGravado = t => { const k=(t||'').toLowerCase(); return k==='gravado'||k.includes('16%'); };
const formatDate = d => d.toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit',year:'numeric'});

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3200);
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();
document.getElementById('inv-date').textContent = formatDate(new Date());

async function doLogout() {
  await sb.auth.signOut();
  window.location.replace('login.html');
}

async function init() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('login.html'); return; }
  currentUserId = session.user.id;

  const { data: lastInv } = await sb.from('facturas').select('nro_factura').order('created_at',{ascending:false}).limit(1);
  if (lastInv && lastInv.length > 0) {
    const last = parseInt(lastInv[0].nro_factura) || 0;
    invoiceCounter = last + 1;
  }
  document.getElementById('inv-num-label').innerHTML = `Nro. ${String(invoiceCounter).padStart(8,'0')} · <span id="inv-date">${formatDate(new Date())}</span>`;

  await loadProducts();
}

async function loadProducts() {
  const { data, error } = await sb.from('productos').select('*').eq('activo', true).order('nombre');
  if (error) { showToast('Error al cargar productos: ' + error.message, 'error'); return; }
  products = data || [];
  renderProducts();
}

function filterProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderProducts(q);
}

function renderProducts(filter = '') {
  const grid = document.getElementById('products-grid');
  const list = filter ? products.filter(p => p.nombre.toLowerCase().includes(filter) || (p.categoria||'').toLowerCase().includes(filter) || (p.codigo||'').toLowerCase().includes(filter)) : products;

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state"><i class="ti ti-package"></i><p>${products.length === 0 ? 'No hay productos.<br>Agrega el primero con el botón <strong>+ Producto</strong>.' : 'Sin resultados para tu búsqueda.'}</p></div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const sc = p.stock === 0 ? 'out' : p.stock <= 2 ? 'low' : '';
    const sl = p.stock === 0 ? 'Agotado' : p.stock <= 2 ? `${p.stock} rest.` : `${p.stock} uds.`;
    const clickFn = p.stock === 0 ? `showToast('Producto agotado','error')` : `addToCart(${p.id})`;
    return `
      <div class="product-card${p.stock===0?' out-of-stock':''}" onclick="${clickFn}" title="${p.nombre}" style="${p.stock===0?'opacity:.45;cursor:not-allowed':''}">
        <span class="stock-badge ${sc}">${sl}</span>
        <div class="product-tag">${p.categoria||'General'} · ${p.codigo||''}</div>
        <div class="product-name">${p.nombre}</div>
        <div class="product-price">${fmtBs(p.precio)}</div>
        <div style="display:flex;gap:.4rem;margin-top:.6rem">
          <button class="btn-sm secondary" style="font-size:.65rem;padding:.25rem .5rem;flex:1" onclick="event.stopPropagation();openModal(${p.id})"><i class="ti ti-edit"></i> Editar</button>
          <button class="btn-sm danger" style="font-size:.65rem;padding:.25rem .5rem" onclick="event.stopPropagation();deleteProduct(${p.id})"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
  }).join('');
}

function openModal(id = null) {
  editingId = id;
  document.getElementById('modal-title-text').textContent = id ? 'Editar Producto' : 'Agregar Producto';
  if (id) {
    const p = products.find(x => x.id === id);
    document.getElementById('p-name').value  = p.nombre;
    document.getElementById('p-cat').value   = p.categoria || '';
    document.getElementById('p-code').value  = p.codigo || '';
    document.getElementById('p-price').value = p.precio;
    document.getElementById('p-stock').value = p.stock;
  } else {
    ['p-name','p-cat','p-code','p-price','p-stock'].forEach(i => document.getElementById(i).value = '');
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); editingId = null; }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

async function saveProduct() {
  const nombre = document.getElementById('p-name').value.trim();
  const precio = parseFloat(document.getElementById('p-price').value);
  if (!nombre || isNaN(precio) || precio < 0) { showToast('Nombre y precio son obligatorios.','error'); return; }

  const payload = {
    nombre,
    categoria:   document.getElementById('p-cat').value.trim() || 'General',
    codigo:      document.getElementById('p-code').value.trim() || ('ART-' + String(Date.now()).slice(-4)),
    precio,
    stock:       parseInt(document.getElementById('p-stock').value) || 0,
    unidad:      'UND',
    tipo_fiscal: 'exento',
    activo:      true,
    user_id:     currentUserId,
  };

  let error;
  if (editingId) {
    ({ error } = await sb.from('productos').update(payload).eq('id', editingId));
  } else {
    ({ error } = await sb.from('productos').insert(payload));
  }

  if (error) { showToast('Error: ' + error.message, 'error'); return; }
  showToast(editingId ? 'Producto actualizado.' : 'Producto agregado.');
  closeModal();
  await loadProducts();
}

async function deleteProduct(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  const { error } = await sb.from('productos').update({ activo: false }).eq('id', id);
  if (error) { showToast('Error: ' + error.message, 'error'); return; }
  cart = cart.filter(x => x.id !== id);
  renderCart();
  showToast('Producto eliminado.', 'error');
  await loadProducts();
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const ex = cart.find(x => x.id === id);
  const currentQty = ex ? ex.qty : 0;

  if (currentQty >= p.stock) {
    showToast('Stock insuficiente. Solo quedan ' + p.stock + ' unidades disponibles.', 'error');
    return;
  }

  if (p.stock - currentQty - 1 <= 2) {
    showToast('Alerta de inventario: Quedan ' + (p.stock - currentQty - 1) + ' unidades de ' + p.nombre, 'error');
  }

  if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
  renderCart();
  showToast(`"${p.nombre}" agregado.`);
}

function changeQty(id, delta) {
  const p = products.find(x => x.id === id);
  const item = cart.find(x => x.id === id);
  if (!item) return;

  const newQty = item.qty + delta;

  if (newQty > p.stock) {
    showToast('No puedes agregar más. Stock máximo alcanzado (' + p.stock + ').', 'error');
    return;
  }

  if (p.stock - newQty <= 2 && delta > 0) {
    showToast('Alerta de inventario: Quedan ' + (p.stock - newQty) + ' unidades de ' + p.nombre, 'error');
  }

  item.qty = newQty;
  if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
  renderCart();
}

function removeFromCart(id) { cart = cart.filter(x => x.id !== id); renderCart(); }
function clearCart() { if (cart.length === 0) return; if (!confirm('¿Limpiar la venta actual?')) return; cart = []; renderCart(); }

function renderCart() {
  const container = document.getElementById('cart-items');
  if (cart.length === 0) {
    container.innerHTML = `<div class="cart-empty"><i class="ti ti-shopping-cart"></i><p>Selecciona productos del catálogo.</p></div>`;
    updateTotals(0, 0); return;
  }
  container.innerHTML = cart.map(item => {
    const lt = item.precio * item.qty;
    return `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.nombre}</div>
          <div class="cart-item-price">${fmtBs(item.precio)} c/u</div>
        </div>
        <div class="cart-item-controls">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},+1)">+</button>
        </div>
        <div class="cart-item-total">${fmtBs(lt)}</div>
        <button class="remove-btn" onclick="removeFromCart(${item.id})"><i class="ti ti-x"></i></button>
      </div>`;
  }).join('');

  let base = 0, exempt = 0;
  cart.forEach(i => { const lt = i.precio * i.qty; if (isGravado(i.tipo_fiscal)) base += lt; else exempt += lt; });
  updateTotals(base, exempt);
}

function updateTotals(base, exempt) {
  const iva = base * IVA;
  document.getElementById('t-total').textContent = fmtBs(base + exempt + iva);
}

async function registrarPago() {
  if (cart.length === 0) { showToast('Agrega productos al registro.','error'); return; }
  const btn = document.getElementById('btn-factura');
  btn.disabled = true;

  const clientName = document.getElementById('client-name').value.trim() || 'CLIENTE DE CONTADO';
  const clientType = document.getElementById('client-type').value;
  const clientRif  = document.getElementById('client-rif').value.trim() || '00000000';
  const payMethod  = document.getElementById('pay-method').value;
  const invType    = 'NOTA_ENTREGA';

  let base = 0, exempt = 0;
  cart.forEach(i => { const lt = i.precio * i.qty; if (isGravado(i.tipo_fiscal)) base += lt; else exempt += lt; });
  const iva = base * IVA;
  const total = base + exempt + iva;
  const invNro = String(invoiceCounter).padStart(8,'0');

  const { error: dbErr } = await sb.from('facturas').insert({
    user_id:        currentUserId,
    nro_factura:    invNro,
    tipo_doc:       invType,
    cliente_nombre: clientName,
    cliente_tipo:   clientType,
    cliente_rif:    clientRif,
    forma_pago:     payMethod,
    items:          cart.map(i => ({ id:i.id, nombre:i.nombre, codigo:i.codigo, precio:i.precio, qty:i.qty, unidad:i.unidad, tipo_fiscal:i.tipo_fiscal })),
    subtotal:       parseFloat(base.toFixed(2)),
    monto_exento:   parseFloat(exempt.toFixed(2)),
    iva:            parseFloat(iva.toFixed(2)),
    total:          parseFloat(total.toFixed(2)),
    fecha:          (new Date(Date.now() - (new Date()).getTimezoneOffset() * 60000)).toISOString().split('T')[0],
  });
  if (dbErr) { showToast('Error al guardar registro: ' + dbErr.message,'error'); btn.disabled = false; return; }

  for (const item of cart) {
    const p = products.find(x => x.id === item.id);
    if (p) {
      const nuevoStock = p.stock - item.qty;
      await sb.from('productos').update({ stock: nuevoStock }).eq('id', item.id);
    }
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  const W = 215.9, M = 15;
  const BLACK=[0,0,0], DARK=[20,22,26], GRAY=[100,110,120], LGRAY=[200,205,210], WHITE=[255,255,255], ABGD=[240,244,248];

  const sf = (style='normal',size=10) => { doc.setFont('Helvetica',style); doc.setFontSize(size); };
  const sc = rgb => doc.setTextColor(...rgb);
  const ln = (x1,y1,x2,y2,r=LGRAY,w=.3) => { doc.setDrawColor(...r); doc.setLineWidth(w); doc.line(x1,y1,x2,y2); };
  const fr = (x,y,w,h,c) => { doc.setFillColor(...c); doc.rect(x,y,w,h,'F'); };

  let Y = 0;
  fr(0,0,W,38,DARK);
  sf('bold',18); sc(WHITE); doc.text(EMPRESA.nombre, M, 14);
  sf('normal',8); sc([180,190,200]);
  doc.text(EMPRESA.direccion, M, 20, {maxWidth: W-M-70});
  doc.text(`Telf: ${EMPRESA.telefono}  |  ${EMPRESA.email}`, M, 25);
  
  sf('bold',14); sc(WHITE); doc.text('NOTA DE ENTREGA', W-M, 14, {align:'right'});
  sf('normal',9); sc([180,190,200]);
  doc.text(`Control Nro.: ${invNro}`, W-M, 20, {align:'right'});
  doc.text(`Fecha: ${formatDate(new Date())}`, W-M, 26, {align:'right'});
  Y = 44;

  fr(M,Y,W-M*2,22,ABGD);
  doc.setDrawColor(...LGRAY); doc.setLineWidth(.3); doc.rect(M,Y,W-M*2,22,'S');
  sf('bold',8); sc(GRAY); doc.text('DATOS DEL CLIENTE', M+4, Y+5);
  sf('bold',9); sc(DARK); doc.text(clientName.toUpperCase(), M+4, Y+11);
  sf('normal',8); sc(GRAY);
  doc.text(`Identificación: ${clientType}-${clientRif}`, M+4, Y+16);
  doc.text(`Forma de Pago: ${payMethod}`, M+4, Y+21);
  doc.text(`Emisión: ${formatDate(new Date())}`, W-M-4, Y+11, {align:'right'});
  Y += 27;

  const COL={num:{x:M,w:10},code:{x:M+10,w:22},name:{x:M+32,w:72},qty:{x:M+104,w:16},price:{x:M+120,w:28},total:{x:M+148,w:W-M-M-148}};
  fr(M,Y,W-M*2,7,DARK); sf('bold',7); sc(WHITE);
  doc.text('#',COL.num.x+2,Y+4.5); doc.text('CÓDIGO',COL.code.x+1,Y+4.5);
  doc.text('DESCRIPCIÓN',COL.name.x+1,Y+4.5);
  doc.text('CANT.',COL.qty.x+1,Y+4.5); doc.text('P. UNIT.',COL.price.x+1,Y+4.5);
  doc.text('TOTAL',COL.total.x+1,Y+4.5);
  Y += 7;

  sf('normal',7.5);
  cart.forEach((item,idx) => {
    const rowH=7, bg=idx%2===0?WHITE:[246,248,250];
    fr(M,Y,W-M*2,rowH,bg); ln(M,Y+rowH,M+W-M*2,Y+rowH);
    sc(DARK);
    const lt = item.precio * item.qty;
    doc.text(String(idx+1), COL.num.x+2, Y+4.5);
    doc.text((item.codigo||'').substring(0,10), COL.code.x+1, Y+4.5);
    doc.text(item.nombre.length>40?item.nombre.substring(0,38)+'…':item.nombre, COL.name.x+1, Y+4.5);
    doc.text(String(item.qty), COL.qty.x+COL.qty.w-2, Y+4.5, {align:'right'});
    doc.text(item.precio.toFixed(2), COL.price.x+COL.price.w-2, Y+4.5, {align:'right'});
    doc.text(lt.toFixed(2), W-M-2, Y+4.5, {align:'right'});
    Y += rowH;
  });
  doc.setDrawColor(...LGRAY); doc.setLineWidth(.3);
  doc.rect(M,Y-7*cart.length-7,W-M*2,7*cart.length+7,'S');
  Y += 6;

  const TW=85, TX=W-M-TW;
  fr(TX,Y,TW,15,ABGD); doc.setDrawColor(...LGRAY); doc.setLineWidth(.3); doc.rect(TX,Y,TW,15,'S');
  let TY=Y+9;
  sf('bold',12); sc(DARK); doc.text('TOTAL RECIBIDO:',TX+4,TY); doc.text(fmtBs(total),TX+TW-3,TY,{align:'right'});
  Y += 21;

  if(Y<220){
    ln(M,Y,W-M,Y); Y+=4; sf('normal',7); sc(GRAY);
    doc.text('Este documento representa un comprobante de entrega y control interno de pago de la tienda. No constituye una factura fiscal.',M,Y,{maxWidth:W-M*2}); Y+=5;
  }
  
  fr(0,265,W,12,DARK); sf('normal',6.5); sc([150,160,170]);
  doc.text(`${EMPRESA.nombre} · ${EMPRESA.telefono}`,W/2,271,{align:'center'});
  doc.text(`Generado el ${new Date().toLocaleString('es-VE')} · Nro. Control: ${invNro}`,W/2,274.5,{align:'center'});

  doc.save(`Recibo_${invNro}_${clientName.replace(/\s+/g,'_').substring(0,20)}.pdf`);

  invoiceCounter++;
  document.getElementById('inv-num-label').innerHTML = `Nro. ${String(invoiceCounter).padStart(8,'0')} · <span id="inv-date">${formatDate(new Date())}</span>`;

  cart = []; 
  await loadProducts(); 
  renderCart();
  btn.disabled = false;
  showToast(`Pago registrado y recibo ${invNro} generado.`);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
init();
</script>
</body>
</html>
