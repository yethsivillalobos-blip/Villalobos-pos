<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILLALOBOS — Catálogo Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-main: #08090a;
    --bg-card: #111316;
    --border: #242830;
    --text: #f0f4f8;
    --muted: #8b95a3;
    --accent: #b8c0cc;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text);
  }
  .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }
  .container {
    padding: 2rem 1.5rem;
    flex: 1;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }
  .product-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    transition: 0.2s ease;
  }
  .product-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .name {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }
  .price {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 1rem;
    margin-top: auto;
  }
  .btn-order {
    width: 100%;
    background: var(--text);
    color: var(--bg-main);
    border: none;
    padding: 0.75rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: center;
    text-decoration: none;
    transition: 0.2s ease;
  }
  .btn-order:hover {
    background: var(--accent);
  }
  .loader {
    text-align: center;
    color: var(--muted);
    padding: 3rem;
    grid-column: 1 / -1;
  }
  @media (min-width: 768px) {
    .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">VILLALOBOS</div>
  <div class="subtitle">Colección Oficial — Envíos Nacionales</div>
</header>

<main class="container">
  <div class="catalog-grid" id="catalog-grid">
    <div class="loader">Cargando colección disponible...</div>
  </div>
</main>

<script>
  const SUPABASE_URL  = 'https://nmjabbfapjxlejwlkucu.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tamFiYmZhcGp4bGVqd2xrdWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTE4MzYsImV4cCI6MjEwMjM4NzgzNn0.LTIse95x2jiLczlaf77eHN44XnQmAIdm45pR4AwPQr4';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Reemplaza con tu número de WhatsApp
  const NUMERO_WHATSAPP = '584140000000';

  const fmtBs = n => 'Bs. ' + parseFloat(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});

  async function loadCatalog() {
    const grid = document.getElementById('catalog-grid');
    
    const { data, error } = await sb.from('productos')
      .select('nombre, categoria, precio')
      .eq('activo', true)
      .gt('stock', 0)
      .order('categoria')
      .order('nombre');

    if (error) {
      grid.innerHTML = '<div class="loader">Error al cargar el catálogo. Intenta nuevamente más tarde.</div>';
      return;
    }

    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="loader">El catálogo se está actualizando. Pronto tendremos nueva mercancía.</div>';
      return;
    }

    grid.innerHTML = data.map(p => {
      const mensaje = encodeURIComponent(`Hola, me interesa adquirir el producto: ${p.nombre} (${fmtBs(p.precio)}). ¿Aún tienen disponibilidad?`);
      const linkWa = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;

      return `
        <div class="product-card">
          <div class="tag">${p.categoria || 'Ropa'}</div>
          <div class="name">${p.nombre}</div>
          <div class="price">${fmtBs(p.precio)}</div>
          <a href="${linkWa}" target="_blank" class="btn-order">Pedir Información</a>
        </div>
      `;
    }).join('');
  }

  loadCatalog();
</script>
</body>
</html>
